<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

  <!-- Primary SEO -->
  <title>Estuscia Group</title>
  <meta name="description"
    content="Estuscia Group, also known as Estuscia or Estusciagroup, is a diversified business ecosystem spanning investment, financial services, business consulting, technology, media, trade, and startup development.">
  <meta name="robots" content="index, follow">
  <meta name="theme-color" content="#05030d">

  <!-- Canonical URL -->
  <link rel="canonical" href="https://www.estusciagroup.com/">

  <!-- Google Site Name Structured Data -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebSite",
    "name": "Estuscia Group",
    "alternateName": [
      "Estuscia",
      "Estusciagroup",
      "www.estusciagroup.com"
    ],
    "url": "https://www.estusciagroup.com/"
  }
  </script>

  <!-- Organization Structured Data -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Organization",
    "name": "Estuscia Group",
    "alternateName": "Estuscia",
    "url": "https://www.estusciagroup.com/",
    "logo": "https://www.estusciagroup.com/images/logo.png"
  }
  </script>

  <!-- Open Graph / Social Sharing -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Estuscia Group | Official Website">
  <meta property="og:site_name" content="Estuscia Group">
  <meta property="og:description"
    content="Discover Estuscia Group, a diversified business ecosystem connecting investment, businesses, technology, media, trade, and opportunities for sustainable growth.">
  <meta property="og:url" content="https://www.estusciagroup.com/">
  <meta property="og:image" content="https://www.estusciagroup.com/images/logo.png">

  <!-- Icons -->
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="apple-touch-icon" href="/favicon.png">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;600&family=Inter:wght@300;400;500&display=swap">
</head>

<body>
  <div id="root"></div>

  <noscript>
    Estuscia Group — Building a Trusted Ecosystem.
    Please enable JavaScript to view the website.
    Contact: support@estuscia.com · (+91) 9633329669
  </noscript>

  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
